<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>IDCraft — Bulk Student ID Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#12181f;
  --ink-soft:#4a5563;
  --paper:#f6f4ee;
  --panel:#ffffff;
  --line:#e3ddd0;
  --accent:#c65d2e;
  --accent-ink:#ffffff;
  --accent2:#1f4e42;
  --ok:#1f7a4d;
  --warn:#b8860b;
  --err:#c0392b;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(18,24,31,.06), 0 8px 24px -12px rgba(18,24,31,.18);
  --shadow-lg:0 24px 60px -20px rgba(18,24,31,.35);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Sora',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --px-per-cm:37.7952755906;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; overflow-x:hidden;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 100% -10%, #fbe9df 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, #e7efe9 0%, transparent 55%),
    var(--paper);
  min-height:100vh;
  line-height:1.5;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
button{font-family:var(--font-body);}
::selection{background:#f0c7ab;}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px 60px;overflow-x:hidden;}

/* ============================================================
   TWO-COLUMN APP LAYOUT (resizable settings panel + live preview)
   ============================================================ */
:root{ --settings-panel-w: 440px; }
.app-layout{display:grid; grid-template-columns:1fr; gap:20px; align-items:start;}
.control-col{min-width:0; display:flex; flex-direction:column; gap:20px;}
.preview-col{min-width:0; display:flex; flex-direction:column; gap:20px;}
@media (min-width:980px){
  .app-layout{
    grid-template-columns: minmax(280px, var(--settings-panel-w)) 18px minmax(300px,1fr);
    column-gap:0; row-gap:20px;
  }
  .preview-col{position:sticky; top:96px; align-self:start; max-height:calc(100vh - 112px); overflow-y:auto; padding-right:2px;}
}

/* resize handle between the settings panel and the live preview */
.panel-resize-handle{
  display:none; position:relative; align-items:center; justify-content:center;
  cursor:col-resize; touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
@media (min-width:980px){ .panel-resize-handle{display:flex;} }
.panel-resize-handle::before{
  content:""; position:absolute; top:0; bottom:0; left:50%; width:1px;
  background:var(--line); transform:translateX(-50%); transition:background .15s ease;
}
.panel-resize-handle .grip{
  position:relative; z-index:2; writing-mode:vertical-lr; font-size:11px; letter-spacing:2px;
  color:var(--ink-soft); background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:10px 2px; box-shadow:var(--shadow); transition:color .15s ease, border-color .15s ease, transform .15s ease;
}
.panel-resize-handle:hover::before,
.panel-resize-handle:focus-visible::before,
body.panel-resizing .panel-resize-handle::before{background:var(--accent);}
.panel-resize-handle:hover .grip,
.panel-resize-handle:focus-visible .grip,
body.panel-resizing .grip{border-color:var(--accent); color:var(--accent); transform:scaleY(1.05);}
.panel-resize-handle:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
body.panel-resizing{cursor:col-resize !important;}
body.panel-resizing, body.panel-resizing *{user-select:none !important;}
.panel-resize-reset{
  display:none; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px;
  padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
  color:var(--ink-soft); cursor:pointer; white-space:nowrap;
}
@media (min-width:980px){ .panel-resize-reset{display:inline-flex;} }
.panel-resize-reset:hover{color:var(--ink); border-color:var(--ink);}

/* ============================================================
   HEADER
   ============================================================ */
.app-header{
  padding:22px 20px 26px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0));
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(10px);
}
.app-header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),#e08a54);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:18px;
  box-shadow:var(--shadow);
  transform:rotate(-4deg);
}
.brand-text h1{font-size:21px;font-weight:700;}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
.header-actions{display:flex;gap:10px;align-items:center;}
.theme-toggle{
  border:1px solid var(--line); background:var(--panel); border-radius:999px;
  width:38px;height:38px; display:flex;align-items:center;justify-content:center;
  cursor:pointer; transition:transform .15s ease, background .2s ease;
}
.theme-toggle:hover{transform:translateY(-1px)}
.step-pills{display:flex;gap:6px;}
.step-pill{
  font-family:var(--font-mono); font-size:11px; padding:6px 10px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink-soft); background:var(--panel);
}
.step-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
@media (max-width:640px){
  .app-header{padding:14px 14px 16px;}
  .brand-mark{width:34px;height:34px;font-size:15px;border-radius:9px;}
  .brand-text h1{font-size:17px;}
  .brand-text p{display:none;}
  .step-pills{display:none;}
}

/* dark theme */
body.dark{--ink:#eef1f4;--ink-soft:#a9b3bd;--paper:#0f1216;--panel:#171b21;--line:#262b32;}
body.dark{background:radial-gradient(1200px 600px at 100% -10%, #24160f 0%, transparent 60%),radial-gradient(900px 500px at -10% 10%, #0f1a15 0%, transparent 55%),var(--paper);}

/* ============================================================
   SECTIONS / STEPS
   ============================================================ */
.step{
  margin-top:28px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step-head{
  display:flex;align-items:center;gap:12px;padding:18px 20px;
  cursor:pointer; user-select:none;
}
.step-num{
  font-family:var(--font-mono); font-size:12px; width:28px;height:28px;border-radius:8px;
  background:var(--paper); border:1px solid var(--line); display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.step-head h2{font-size:16.5px;flex:1;}
.step-head .hint{font-size:12px;color:var(--ink-soft);}
.chevron{transition:transform .25s ease; color:var(--ink-soft); flex-shrink:0;}
.step.collapsed .chevron{transform:rotate(-90deg);}
.step-body{padding:0 20px 22px; display:grid; gap:18px;}
.step.collapsed .step-body{display:none;}
@media (max-width:480px){
  .step-head{padding:14px 14px; gap:8px;}
  .step-head h2{font-size:15px;}
  .step-head .hint{display:none;}
  .step-body{padding:0 14px 18px;}
}

/* ============================================================
   BUTTONS / INPUTS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:13.5px; padding:11px 18px; border-radius:10px;
  border:1px solid transparent; cursor:pointer; transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink); color:#fff;}
.btn-primary:hover{box-shadow:0 8px 20px -8px rgba(18,24,31,.5);}
.btn-accent{background:var(--accent); color:#fff;}
.btn-accent:hover{box-shadow:0 8px 20px -8px rgba(198,93,46,.6);}
.btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-outline:hover{background:var(--paper);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1px dashed var(--line);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn-danger{background:transparent;color:var(--err);border:1px solid #f1c8c2;}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
.btn-block{width:100%;}

label.field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px;}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%; font-family:var(--font-body); font-size:13.5px; padding:10px 12px;
  border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent); box-shadow:0 0 0 3px rgba(198,93,46,.15);}
textarea{resize:vertical; min-height:64px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
input[type=range]{width:100%; accent-color:var(--accent);}
.range-row{display:flex;align-items:center;gap:10px;}
.range-row .val{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);min-width:52px;text-align:right;}
.toggle-group{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.toggle-group button{flex:1; padding:9px; border:none; background:var(--panel); color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer;}
.toggle-group button.active{background:var(--ink); color:#fff;}
.fmt-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px; background:var(--paper); border-radius:10px; border:1px solid var(--line);}
.fmt-toolbar select,.fmt-toolbar input[type=number]{width:auto; min-width:74px; padding:7px 8px; font-size:12.5px;}
.fmt-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.fmt-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.fmt-btn.italic{font-style:italic;}
.fmt-btn.underline{text-decoration:underline;}
input[type=color]{-webkit-appearance:none;width:32px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;cursor:pointer;background:var(--panel);}

/* ============================================================
   DROPZONE
   ============================================================ */
.dropzone{
  border:2px dashed var(--line); border-radius:var(--radius-sm); padding:30px 20px; text-align:center;
  background:var(--paper); transition:all .2s ease; cursor:pointer;
}
.dropzone.drag{border-color:var(--accent); background:#fbeee5;}
.dropzone svg{opacity:.55;}
.dropzone p{margin:10px 0 4px; font-weight:600; font-size:14px;}
.dropzone span{font-size:12px; color:var(--ink-soft);}
.sample-row{display:flex;align-items:center;justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:6px;}
.sample-row p{margin:0;font-size:12.5px;color:var(--ink-soft);}

/* progress */
.progress-line{height:6px; border-radius:99px; background:var(--line); overflow:hidden; position:relative;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#e08a54); transition:width .25s ease; border-radius:99px;}
.progress-fill.indeterminate{width:40%; animation:indet 1.1s ease-in-out infinite;}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.progress-label{font-size:11.5px; font-family:var(--font-mono); color:var(--ink-soft); margin-top:6px;}

/* toast */
#toastHost{position:fixed; bottom:18px; right:18px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{
  background:var(--ink); color:#fff; padding:12px 14px; border-radius:10px; font-size:13px;
  box-shadow:var(--shadow-lg); display:flex; gap:10px; align-items:flex-start;
  animation:toastIn .3s cubic-bezier(.2,.8,.3,1) both;
}
.toast.err{background:var(--err);}
.toast.ok{background:var(--ok);}
.toast.warn{background:#8a6d00;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

/* ============================================================
   STUDENT TABLE
   ============================================================ */
.table-toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;}
.table-toolbar .filters{display:flex; flex-wrap:wrap; gap:8px; flex:1;}
.filters input,.filters select{width:auto; min-width:130px;}
.count-chip{
  font-family:var(--font-mono); font-size:12px; padding:6px 12px; border-radius:999px;
  background:var(--paper); border:1px solid var(--line); white-space:nowrap;
}
.table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
table.student-table{width:100%; border-collapse:collapse; font-size:12.8px; min-width:880px;}
.student-table th{
  text-align:left; padding:10px 10px; background:var(--paper); font-weight:700; font-size:11.3px;
  text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:1px solid var(--line);
  position:sticky; top:0;
}
.student-table td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
.student-table tr:hover td{background:rgba(198,93,46,.045);}
.mini-photo{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--paper);border:1px solid var(--line);}
.mini-photo.missing{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--err);text-align:center;}
.row-actions{display:flex; gap:6px;}
.icon-btn{
  width:28px;height:28px; border-radius:7px; border:1px solid var(--line); background:var(--panel);
  display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink-soft); flex-shrink:0;
  transition:background .15s ease, color .15s ease;
}
.icon-btn:hover{background:var(--paper); color:var(--ink);}
.icon-btn.danger:hover{color:var(--err); border-color:#f1c8c2;}
.badge{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:99px;}
.badge.ok{background:#e4f4ea; color:var(--ok);}
.badge.miss{background:#fdeceb; color:var(--err);}
.empty-state{padding:44px 20px; text-align:center; color:var(--ink-soft);}
.empty-state svg{opacity:.4; margin-bottom:10px;}

/* ============================================================
   TEMPLATE GALLERY
   ============================================================ */
.tpl-scroll{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;
  padding:6px 2px 4px; max-height:460px; overflow-y:auto; overscroll-behavior:contain;
}
@media (min-width:520px){.tpl-scroll{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:820px){.tpl-scroll{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (min-width:980px) and (max-width:1239px){.tpl-scroll{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (min-width:1240px){.tpl-scroll{grid-template-columns:repeat(3,minmax(0,1fr)); max-height:520px;}}
@media (min-width:1500px){.tpl-scroll{grid-template-columns:repeat(4,minmax(0,1fr));}}
.tpl-card{
  cursor:pointer; border-radius:10px; padding:6px;
  border:2px solid transparent; transition:transform .18s ease, border-color .18s ease;
  text-align:center; min-width:0;
}
.tpl-card:hover{transform:translateY(-3px);}
.tpl-card.active{border-color:var(--accent); background:rgba(198,93,46,.08);}
.tpl-thumb{
  width:100%; aspect-ratio:5/3.2; border-radius:8px; position:relative; overflow:hidden; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.tpl-card.active .tpl-thumb::after{
  content:"✓"; position:absolute; top:4px; right:4px; width:16px; height:16px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.35); z-index:3;
}
.tpl-thumb .t-head{height:38%; display:flex; align-items:center; justify-content:center; font-size:6px; font-weight:800; letter-spacing:.03em; text-align:center; padding:2px;}
.tpl-thumb .t-body{flex:1; display:flex; align-items:center; gap:4px; padding:4px 6px;}
.tpl-thumb .t-photo{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85); flex-shrink:0;}
.tpl-thumb .t-lines{flex:1; display:flex; flex-direction:column; gap:2px;}
.tpl-thumb .t-lines i{display:block; height:2.5px; border-radius:2px; background:rgba(0,0,0,.18);}
.tpl-name{font-size:11px; margin-top:6px; font-weight:600; color:var(--ink-soft);}
.tpl-card.active .tpl-name{color:var(--ink);}

/* ============================================================
   DESIGN CONTROLS GRID
   ============================================================ */
.design-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
.panel-box{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--paper);}
.panel-box h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:12px;}
.upload-row{display:flex; align-items:center; gap:10px;}
.thumb-preview{width:46px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--panel);object-fit:contain;flex-shrink:0;}

/* ============================================================
   LIVE PREVIEW / CARD
   ============================================================ */
.preview-layout{display:grid; grid-template-columns:1fr; gap:16px;}
@media (min-width:1500px){.preview-layout{grid-template-columns:minmax(0,1fr) 220px;}}
.preview-stage{
  background:
    repeating-conic-gradient(#efe9db 0% 25%, #f6f2e8 0% 50%) 0 0/22px 22px;
  border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; align-items:center; justify-content:center;
  height:clamp(220px, 42vh, 420px); max-width:100%; overflow:auto; box-sizing:border-box;
}
@media (min-width:980px){
  .preview-stage{height:clamp(200px, 34vh, 340px);}
}
.preview-side{display:flex; flex-direction:column; gap:12px;}
.zoom-row{display:flex; align-items:center; gap:8px; justify-content:center;}
.zoom-row button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;}

/* The ID card itself */
.id-card{
  position:relative; background:#fff; overflow:hidden; transform-origin:center;
  box-shadow:0 2px 8px rgba(0,0,0,.12), 0 22px 40px -20px rgba(0,0,0,.35);
  display:flex; flex-direction:column;
  font-family:'Sora',sans-serif;
}
.id-card .card-header{position:relative; z-index:2; display:flex; flex-direction:row; align-items:center; text-align:left; gap:4%; padding:4% 6% 2%; flex-shrink:0;}
.id-card .card-logo{object-fit:contain; flex-shrink:0;}
.id-card .card-header-text{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:1px; overflow:hidden;}
.id-card .card-schoolname{width:100%; overflow:hidden;}
.id-card .card-schooladdress{width:100%; overflow:hidden;}
.id-card .card-body{position:relative; z-index:2; display:flex; flex:1; gap:4%; padding:2% 6%; align-items:flex-start; min-height:0; min-width:0; overflow:hidden;}
.id-card .card-photo-wrap{flex-shrink:0; overflow:hidden; background:#eee; display:flex; align-items:center; justify-content:center; border:2px solid rgba(0,0,0,.08);}
.id-card .card-photo{width:100%; height:100%; object-fit:cover;}
.id-card .card-photo-wrap .noimg{font-size:9px; color:#999; text-align:center; padding:4px;}
.id-card .card-info{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:3%; justify-content:center; overflow:hidden;}
.id-card .info-row{display:flex; gap:6px; font-size:11.5px; line-height:1.3;}
.id-card .info-label{font-weight:700; opacity:.62; flex-shrink:0; min-width:46%;}
.id-card .info-value{font-weight:600; word-break:break-word;}
.id-card .stu-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-bottom:2%; line-height:1.15;}
.id-card .card-footer{position:relative; z-index:3; display:flex; align-items:flex-end; justify-content:space-between; padding:1.5% 6% 3.5%; gap:8px; margin-top:auto; flex-shrink:0;}
.id-card .valid-upto{font-size:9px; font-weight:600; opacity:.75; flex-shrink:0; max-width:60%;}
.id-card .signature{display:flex; flex-direction:column; align-items:center; gap:1px; flex-shrink:0;}
.id-card .signature img{object-fit:contain; display:block;}
.id-card .signature span{font-size:7.5px; border-top:1px solid rgba(0,0,0,.35); padding-top:2px; opacity:.7; min-width:60px; text-align:center;}
.id-card .card-decor{position:absolute; inset:0; z-index:1; pointer-events:none;}

/* decorative variants */
.id-card[data-decor="stripe"] .card-decor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:var(--tpl-accent2);}
.id-card[data-decor="ribbon"] .card-decor::before{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 42px 42px 0;border-color:transparent var(--tpl-accent2) transparent transparent;}
.id-card[data-decor="wave"] .card-decor::before{content:"";position:absolute;left:-5%;right:-5%;top:0;height:20%;background:var(--tpl-accent);border-radius:0 0 55% 55%/0 0 100% 100%;opacity:.16;}
.id-card[data-decor="medallion"] .card-decor::before{content:"";position:absolute;right:-8%;bottom:-8%;width:38%;aspect-ratio:1;border-radius:50%;border:6px solid var(--tpl-accent2);opacity:.14;}
.id-card[data-decor="doubleborder"]{outline:2px solid var(--tpl-accent2); outline-offset:-8px;}
.id-card[data-decor="grid"] .card-decor::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--tpl-accent) 1px,transparent 1px),linear-gradient(90deg,var(--tpl-accent) 1px,transparent 1px);background-size:14px 14px;opacity:.05;}
.id-card[data-decor="diagonal"] .card-decor::before{content:"";position:absolute;top:0;left:0;right:0;height:34%;background:var(--tpl-accent);clip-path:polygon(0 0,100% 0,100% 45%,0 100%);}
.id-card[data-decor="diagonal-reverse"] .card-decor::before{content:"";position:absolute;top:0;left:0;right:0;height:34%;background:var(--tpl-accent);clip-path:polygon(0 0,100% 0,100% 100%,0 45%);}
.id-card[data-decor="cornercut"]{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);}
.id-card[data-decor="none"] .card-decor{display:none;}

/* structural layouts */
.id-card[data-layout="left-photo"] .card-body{flex-direction:row;}
.id-card[data-layout="right-photo"] .card-body{flex-direction:row-reverse;}
.id-card[data-layout="top-photo"] .card-body{flex-direction:column; align-items:center; text-align:center;}
.id-card[data-layout="top-photo"] .card-info{align-items:center;}
.id-card[data-layout="top-photo"] .info-row{justify-content:center;}
.id-card[data-layout="diagonal"] .card-body{flex-direction:row; padding-top:8%;}
.id-card[data-layout="diagonal-reverse"] .card-body{flex-direction:row-reverse; padding-top:8%;}

/* sidebar layouts — full-height accent panel holding the photo, with
   header/info/footer stacked in the remaining column */
.id-card[data-layout="sidebar-left"],
.id-card[data-layout="sidebar-right"]{display:grid; grid-template-rows:auto 1fr auto;}
.id-card[data-layout="sidebar-left"]{grid-template-columns:32% 1fr;}
.id-card[data-layout="sidebar-right"]{grid-template-columns:1fr 32%;}
.id-card[data-layout="sidebar-left"] .card-sidebar{grid-column:1; grid-row:1/-1;}
.id-card[data-layout="sidebar-right"] .card-sidebar{grid-column:2; grid-row:1/-1;}
.id-card[data-layout="sidebar-left"] .card-header{grid-column:2; grid-row:1;}
.id-card[data-layout="sidebar-left"] .card-body{grid-column:2; grid-row:2;}
.id-card[data-layout="sidebar-left"] .card-footer{grid-column:2; grid-row:3;}
.id-card[data-layout="sidebar-right"] .card-header{grid-column:1; grid-row:1;}
.id-card[data-layout="sidebar-right"] .card-body{grid-column:1; grid-row:2;}
.id-card[data-layout="sidebar-right"] .card-footer{grid-column:1; grid-row:3;}
.id-card[data-layout^="sidebar"] .card-body{flex-direction:column; align-items:stretch; justify-content:center;}
.id-card[data-layout^="sidebar"] .card-header{text-align:left;}
.card-sidebar{position:relative; z-index:2; display:flex; align-items:center; justify-content:center; padding:9%; background:var(--tpl-accent);}
.card-sidebar .card-photo-wrap{width:100% !important; height:auto !important; aspect-ratio:1; border:3px solid rgba(255,255,255,.55) !important;}

/* ============================================================
   SELECT-STUDENT STRIP
   ============================================================ */
.stu-strip{display:flex; gap:8px; overflow-x:auto; padding:4px 2px;}
.stu-chip{
  flex-shrink:0; display:flex; align-items:center; gap:7px; padding:6px 10px 6px 6px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:12px; font-weight:600;
  transition:border-color .15s ease, background .15s ease;
}
.stu-chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--paper);}
.stu-chip.active{border-color:var(--accent); background:#fbeee5;}

/* generate cta */
.generate-grid{display:grid; grid-template-columns:1fr; gap:14px;}
@media (min-width:1600px){.generate-grid{grid-template-columns:1fr 1fr;}}
.generate-card{border:1px solid var(--line); border-radius:12px; padding:18px; background:var(--paper); display:flex; flex-direction:column; gap:10px;}
.generate-card h3{font-size:14.5px;}
.generate-card p{font-size:12.5px; color:var(--ink-soft); margin:0;}
.note-box{font-size:12px; background:#fff7e6; border:1px solid #f0dca3; color:#7a5c00; padding:10px 12px; border-radius:9px;}
body.dark .note-box{background:#2a230d;border-color:#54440f;color:#e0c368;}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,18,22,.55); z-index:200; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (min-width:720px){.modal-backdrop{align-items:center;}}
.modal{
  background:var(--panel); width:100%; max-width:520px; border-radius:16px 16px 0 0; max-height:88vh; overflow:auto;
  padding:20px; animation:modalUp .25s cubic-bezier(.2,.8,.3,1) both; box-shadow:var(--shadow-lg);
}
@media (min-width:720px){.modal{border-radius:16px;}}
@keyframes modalUp{from{transform:translateY(30px); opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px; margin-bottom:14px;}
.modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

/* spinner */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* helper */
.hidden{display:none !important;}
.row{display:flex;gap:10px;align-items:center;}
.grow{flex:1;}
.small{font-size:11.5px;color:var(--ink-soft);}
.section-divider{height:1px;background:var(--line);margin:2px 0;}
footer.app-footer{max-width:1280px;margin:40px auto 0;padding:20px;text-align:center;color:var(--ink-soft);font-size:11.5px;}
</style>
</head>

function toast(msg, kind){
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.innerHTML = `<span>${kind==="err"?"⚠️":kind==="ok"?"✅":kind==="warn"?"⚠️":"ℹ️"}</span><span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; el.style.transition="all .25s ease"; setTimeout(()=>el.remove(),260); }, 3400);
}

function uid(){ return "s_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normHeader(s){ return String(s||"").toLowerCase().replace(/[^a-z]/g,""); }
// Accepts PNG / JPG / JPEG / SVG for logo & signature uploads (checks the
// MIME type first, falling back to the file extension since some OSes/
// browsers report SVG files with an empty or generic MIME type).
function isSupportedImageFile(file){
  const okTypes = ["image/png","image/jpeg","image/jpg","image/svg+xml"];
  if(file.type && okTypes.includes(file.type)) return true;
  return /\.(png|jpe?g|svg)$/i.test(file.name||"");
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function b64ToArrayBuffer(b64){
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function formatDatePretty(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", { month:"long", year:"numeric" });
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

const HEADER_MAP = {
  roll: ["roll","rollno","rollnumber"],
  name: ["studentname","name"],
  cls: ["class"],
  section: ["section"],
  vill: ["vill","village"],
  po: ["po"],
  dist: ["dist","district"],
  blood: ["bloodgroup","blood"],
  photo: ["photo","photograph"],
};

function detectColumns(headerRow){
  const norm = headerRow.map(normHeader);
  const map = {};
  for(const key in HEADER_MAP){
    const candidates = HEADER_MAP[key];
    let idx = -1;
    for(const cand of candidates){
      idx = norm.findIndex(h => h === cand);
      if(idx !== -1) break;
    }
    if(idx === -1){
      idx = norm.findIndex(h => candidates.some(c => h.includes(c)));
    }
    map[key] = idx;
  }
  return map;
}

function normalizeZipPath(baseDir, target){
  if(target.startsWith("/")) return target.slice(1);
  const baseParts = baseDir.split("/").filter(Boolean);
  const parts = target.split("/");
  for(const p of parts){
    if(p === "..") baseParts.pop();
    else if(p === "." || p === "") continue;
    else baseParts.push(p);
  }
  return baseParts.join("/");
}
function dirname(path){
  const i = path.lastIndexOf("/");
  return i === -1 ? "" : path.slice(0,i);
}
const R_NS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";

async function extractEmbeddedImages(arrayBuffer){
  // Returns { rowIndexToDataURL } where rowIndex is the 0-based Excel row
  // number as encoded in the drawing XML (0 == header row).
  try{
    const zip = await JSZip.loadAsync(arrayBuffer);
    const parser = new DOMParser();

    const wbFile = zip.file("xl/workbook.xml");
    const wbRelsFile = zip.file("xl/_rels/workbook.xml.rels");
    if(!wbFile || !wbRelsFile) return {};

    const wbDoc = parser.parseFromString(await wbFile.async("string"), "application/xml");
    const wbRelsDoc = parser.parseFromString(await wbRelsFile.async("string"), "application/xml");

    const sheetEl = Array.from(wbDoc.getElementsByTagName("sheet"))[0];
    if(!sheetEl) return {};
    const rId = sheetEl.getAttributeNS(R_NS,"id") || sheetEl.getAttribute("r:id");
    const wbRel = Array.from(wbRelsDoc.getElementsByTagName("Relationship")).find(r=>r.getAttribute("Id")===rId);
    if(!wbRel) return {};
    const sheetPath = normalizeZipPath("xl", wbRel.getAttribute("Target"));

    const sheetRelsPath = dirname(sheetPath) + "/_rels/" + sheetPath.split("/").pop() + ".rels";
    const sheetRelsFile = zip.file(sheetRelsPath);
    if(!sheetRelsFile) return {};
    const sheetRelsDoc = parser.parseFromString(await sheetRelsFile.async("string"), "application/xml");
    const drawingRel = Array.from(sheetRelsDoc.getElementsByTagName("Relationship")).find(r => /drawing/i.test(r.getAttribute("Type")||""));
    if(!drawingRel) return {};
    const drawingPath = normalizeZipPath(dirname(sheetPath), drawingRel.getAttribute("Target"));

    const drawingFile = zip.file(drawingPath);
    if(!drawingFile) return {};
    const drawingDoc = parser.parseFromString(await drawingFile.async("string"), "application/xml");

    const drawingRelsPath = dirname(drawingPath) + "/_rels/" + drawingPath.split("/").pop() + ".rels";
    const drawingRelsFile = zip.file(drawingRelsPath);
    const drawingRels = {};
    if(drawingRelsFile){
      const drDoc = parser.parseFromString(await drawingRelsFile.async("string"), "application/xml");
      Array.from(drDoc.getElementsByTagName("Relationship")).forEach(r=>{
        drawingRels[r.getAttribute("Id")] = normalizeZipPath(dirname(drawingPath), r.getAttribute("Target"));
      });
    }

    const anchors = Array.from(drawingDoc.getElementsByTagName("*")).filter(el => el.localName === "oneCellAnchor" || el.localName === "twoCellAnchor");
    const result = {};
    for(const anchor of anchors){
      const fromEl = Array.from(anchor.children).find(c => c.localName === "from");
      if(!fromEl) continue;
      const rowEl = Array.from(fromEl.children).find(c => c.localName === "row");
      if(!rowEl) continue;
      const rowIdx = parseInt(rowEl.textContent, 10);

      let blipEl = null;
      for(const e of Array.from(anchor.getElementsByTagName("*"))){
        if(e.localName === "blip"){ blipEl = e; break; }
      }
      if(!blipEl) continue;
      const embedId = blipEl.getAttributeNS(R_NS,"embed") || blipEl.getAttribute("r:embed");
      const mediaPath = drawingRels[embedId];
      if(!mediaPath) continue;
      const mediaFile = zip.file(mediaPath);
      if(!mediaFile) continue;
      const base64 = await mediaFile.async("base64");
      const ext = mediaPath.split(".").pop().toLowerCase();
      const mime = ext==="png" ? "image/png" : (ext==="jpg"||ext==="jpeg") ? "image/jpeg" : ext==="gif" ? "image/gif" : ext==="bmp" ? "image/bmp" : "image/png";
      result[rowIdx] = `data:${mime};base64,${base64}`;
    }
    return result;
  }catch(err){
    console.warn("Embedded image extraction failed:", err);
    return {};
  }
}

async function handleExcelFile(file){
  if(!file) return;
  showImportProgress(true, "Importing students…");
  try{
    const arrayBuffer = await file.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, { type:"array" });
    const sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"", raw:false });
    if(!rows.length){ toast("The Excel file appears to be empty.", "err"); showImportProgress(false); return; }

    const headerRow = rows[0];
    const colMap = detectColumns(headerRow);
    const missingRequired = ["roll","name"].filter(k => colMap[k] === -1);
    if(missingRequired.length){
      toast("Could not find required columns (Roll / Student Name). Please check the sheet headers.", "err");
      showImportProgress(false);
      return;
    }

    const dataRows = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ""));
    const photoMap = await extractEmbeddedImages(arrayBuffer);

    const students = [];
    dataRows.forEach((r, i) => {
      const get = (key) => colMap[key] === -1 ? "" : String(r[colMap[key]] ?? "").trim();
      const excelRowXmlIdx = i + 1; // header occupies xml row 0
      students.push({
        id: uid(),
        roll: get("roll"),
        name: get("name"),
        cls: get("cls"),
        section: get("section"),
        vill: get("vill"),
        po: get("po"),
        dist: get("dist"),
        blood: get("blood"),
        photo: photoMap[excelRowXmlIdx] || null,
        selected: true,
      });
    });

    if(!students.length){ toast("No student rows were found in the file.", "err"); showImportProgress(false); return; }

    state.students = students;
    state.ui.previewStudentId = students[0].id;
    const withPhoto = students.filter(s=>s.photo).length;
    toast(`Imported ${students.length} students · ${withPhoto} photo${withPhoto===1?"":"s"} extracted${withPhoto<students.length?`, ${students.length-withPhoto} missing`:""}.`, withPhoto===students.length ? "ok" : "warn");
    renderAll();
  }catch(err){
    console.error(err);
    toast("Could not read this Excel file. Please make sure it's a valid .xlsx/.xls workbook.", "err");
  }finally{
    showImportProgress(false);
  }
}

/* ==================================================================
   CARD BUILDER — shared renderer used by live preview + exports
   ================================================================== */
function getTemplate(id){ return TEMPLATES.find(t=>t.id===id) || TEMPLATES[0]; }

function cardPixelSize(){
  const { widthCm, heightCm, orientation } = state.design;
  let wCm = widthCm, hCm = heightCm;
  if(orientation === "landscape" && hCm > wCm){ const t=wCm; wCm=hCm; hCm=t; }
  if(orientation === "portrait" && wCm > hCm){ const t=wCm; wCm=hCm; hCm=t; }
  return { wCm, hCm, wPx: wCm*PX_PER_CM, hPx: hCm*PX_PER_CM };
}

function fmtStyleString(fmt){
  let s = "";
  s += `font-family:${fmt.font};`;
  s += `font-size:${fmt.size}px;`;
  s += `font-weight:${fmt.bold?700:500};`;
  if(fmt.italic) s += `font-style:italic;`;
  let td = [];
  if(fmt.underline) td.push("underline");
  s += `text-decoration:${td.length?td.join(" "):"none"};`;
  s += `text-align:${fmt.align};`;
  s += `letter-spacing:${fmt.spacing}px;`;
  s += `line-height:${fmt.lineHeight};`;
  s += `color:${fmt.color};`;
  if(fmt.bg) s += `background:${fmt.bg}; padding:1px 4px; border-radius:3px; display:inline-block;`;
  if(fmt.transform) s += `text-transform:${fmt.transform};`;
  return s;
}

// Consistent, labeled address formatting used everywhere the address is
// shown (Live Preview, PNG, PDF). Produces a compact single line
// ("Vill: X, P.O.: Y, Dist.: Z") which wraps automatically via CSS
// (word-break on .info-value) when the card is too narrow to fit it —
// so short cards/templates naturally get a 2-line wrap instead of overflow.
function formatStudentAddress(student){
  const parts = [];
  if(student.vill) parts.push(`Vill: ${student.vill}`);
  if(student.po) parts.push(`P.O.: ${student.po}`);
  if(student.dist) parts.push(`Dist.: ${student.dist}`);
  return parts.join(", ");
}

// ==================================================================
// SMART SPACE MANAGEMENT SYSTEM
// Runs after a card is built + attached to the DOM (real pixel layout
// available). It progressively shrinks text that doesn't fit its
// allotted space — school name/address, student name, and each info
// row — then, as a final safety net, shrinks everything a little more
// together if the card's total content still overflows the fixed
// physical card height. This keeps every element inside the card with
// no clipping/overlap regardless of template, orientation, card size,
// or text length, without ever growing the card itself.
// ==================================================================
function fitTextBlock(el, minPx, maxLines){
  if(!el || !el.textContent || !el.textContent.trim()) return;
  const cs = getComputedStyle(el);
  let size = parseFloat(cs.fontSize) || 12;
  const lh = parseFloat(cs.lineHeight);
  const lineHeightRatio = (lh && size) ? (lh/size) : 1.25;
  const maxHeight = maxLines ? (size*lineHeightRatio*maxLines) : Infinity;
  let guard = 0;
  while(guard < 40 && size > minPx && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > maxHeight + 2)){
    size -= 0.4;
    el.style.fontSize = size.toFixed(1) + "px";
    if(maxLines) { /* maxHeight scales down with size automatically via recompute below */ }
    guard++;
  }
}

function fitCardContent(card){
  if(!card) return;
  const nameEl = card.querySelector(".card-schoolname");
  const addrEl = card.querySelector(".card-schooladdress");
  const stuName = card.querySelector(".stu-name");
  const infoVals = Array.from(card.querySelectorAll(".info-value"));

  if(nameEl) fitTextBlock(nameEl, 8, 2);
  if(addrEl) fitTextBlock(addrEl, 6.5, 2);
  if(stuName) fitTextBlock(stuName, 9, 1);
  infoVals.forEach(v => fitTextBlock(v, 7, 2));

  // Smart photo management: if the configured photo size doesn't fit the
  // available main-content area for this card/template/orientation,
  // constrain it to the largest size that does — preserving aspect ratio
  // — instead of letting it overlap the header/footer or student info.
  const photoWrap = card.querySelector(".card-photo-wrap");
  const body = card.querySelector(".card-body");
  if(photoWrap && body && photoWrap.parentElement === body && photoWrap.offsetWidth > 0 && photoWrap.offsetHeight > 0){
    const isColumnBody = getComputedStyle(body).flexDirection.indexOf("column") === 0;
    const maxH = isColumnBody ? body.clientHeight * 0.62 : body.clientHeight;
    const maxW = isColumnBody ? body.clientWidth : body.clientWidth * 0.55;
    const curW = photoWrap.offsetWidth, curH = photoWrap.offsetHeight;
    const scale = Math.min(1, maxH/curH, maxW/curW);
    if(scale < 0.98){
      photoWrap.style.width = (curW*scale) + "px";
      photoWrap.style.height = (curH*scale) + "px";
    }
  }

  // Final safety net: if the card's rendered content still overflows the
  // fixed physical card height (long name + long address + long info all
  // at once), shrink everything a bit further together rather than let
  // anything clip or the footer get pushed outside the card.
  const shrinkables = [
    ...(nameEl ? [nameEl] : []),
    ...(addrEl ? [addrEl] : []),
    ...(stuName ? [stuName] : []),
    ...infoVals,
    ...Array.from(card.querySelectorAll(".info-label, .valid-upto, .signature span"))
  ];
  const cardH = card.clientHeight;
  let guard = 0;
  while(cardH && card.scrollHeight > cardH + 1 && guard < 24){
    shrinkables.forEach(el=>{
      const s = parseFloat(getComputedStyle(el).fontSize);
      if(s > 6) el.style.fontSize = (s - 0.3).toFixed(1) + "px";
    });
    guard++;
  }
}

// ==================================================================
// MANUAL POSITION SYSTEM
// Applies the user's Photo / Address / Logo / Signature position
// offsets to an already-attached (in-DOM) card. Offsets are stored as
// a percentage of the card's own pixel width/height, so movement stays
// proportionally correct across card sizes, orientations and templates
// (relative/unit-based positioning per spec, not fixed pixels).
// Runs AFTER fitCardContent() so Smart Space Management's overflow
// measurements (scrollHeight/offsetWidth) are taken on the untransformed
// layout — CSS transforms are purely visual and never affect those.
// A soft clamp keeps at least ~30% of each moved element overlapping
// the card so nothing can be dragged completely outside it.
// ==================================================================
function applyManualPositions(card){
  if(!card) return;
  const wPx = card.offsetWidth, hPx = card.offsetHeight;
  if(!wPx || !hPx) return;
  const cardRect = card.getBoundingClientRect();

  function place(el, offXPct, offYPct){
    if(!el) return;
    offXPct = offXPct || 0; offYPct = offYPct || 0;
    let tx = (offXPct/100) * wPx;
    let ty = (offYPct/100) * hPx;
    el.style.transform = `translate(${tx}px, ${ty}px)`;
    if(offXPct === 0 && offYPct === 0) return; // nothing to clamp at the default position
    const r = el.getBoundingClientRect();
    const minVisX = Math.min(r.width, wPx) * 0.3;
    const minVisY = Math.min(r.height, hPx) * 0.3;
    let dx = 0, dy = 0;
    if(r.right < cardRect.left + minVisX) dx = (cardRect.left + minVisX) - r.right;
    if(r.left > cardRect.right - minVisX) dx = (cardRect.right - minVisX) - r.left;
    if(r.bottom < cardRect.top + minVisY) dy = (cardRect.top + minVisY) - r.bottom;
    if(r.top > cardRect.bottom - minVisY) dy = (cardRect.bottom - minVisY) - r.top;
    if(dx || dy){
      tx += dx; ty += dy;
      el.style.transform = `translate(${tx}px, ${ty}px)`;
    }
  }

  place(card.querySelector(".card-photo-wrap"), state.design.photoOffsetX, state.design.photoOffsetY);
  // Student Information Group: Name, Roll, Class, Blood Group & Address all
  // live inside .card-info and move together as one unit so their relative
  // spacing never changes — only the group's overall position shifts.
  place(card.querySelector(".card-info"), state.design.addrOffsetX, state.design.addrOffsetY);
  place(card.querySelector(".card-logo"), state.school.logoOffsetX, state.school.logoOffsetY);
  place(card.querySelector(".signature"), state.school.sigOffsetX, state.school.sigOffsetY);
}

function buildCardElement(student, opts){
  opts = opts || {};
  const tpl = getTemplate(state.design.templateId);
  const { wPx, hPx } = cardPixelSize();
  const card = document.createElement("div");
  card.className = "id-card";
  card.setAttribute("data-layout", tpl.layout);
  card.setAttribute("data-decor", tpl.decor);
  card.style.width = wPx + "px";
  card.style.height = hPx + "px";
  card.style.background = tpl.bg;
  card.style.color = tpl.text;
  card.style.borderRadius = tpl.radius || "16px";
  card.style.setProperty("--tpl-accent", tpl.accent);
  card.style.setProperty("--tpl-accent2", tpl.accent2);
  if(opts.scale) card.style.transform = `scale(${opts.scale})`;

  const sch = state.school;
  const headerOnAccent = tpl.headerStyle === "onaccent";

  // header — logo on the LEFT, School Name + Address stacked in a column to its right
  const header = document.createElement("div");
  header.className = "card-header";
  if(headerOnAccent){ header.style.position="relative"; header.style.zIndex="3"; header.style.color="#fff"; }
  if(sch.logo){
    const logo = document.createElement("img");
    logo.className = "card-logo"; logo.src = sch.logo;
    logo.style.width = (sch.logoW * (PX_PER_CM/10)) + "px";
    logo.style.height = (sch.logoH * (PX_PER_CM/10)) + "px";
    logo.onerror = ()=>{ logo.style.display = "none"; }; // a broken/unsupported upload never breaks card layout
    header.appendChild(logo);
  }
  const headerText = document.createElement("div");
  headerText.className = "card-header-text";
  const nameEl = document.createElement("div");
  nameEl.className = "card-schoolname";
  nameEl.textContent = sch.name || "SCHOOL NAME";
  nameEl.setAttribute("style", fmtStyleString(sch.nameFmt) + (headerOnAccent?"color:#fff;":""));
  headerText.appendChild(nameEl);
  const addrEl = document.createElement("div");
  addrEl.className = "card-schooladdress";
  addrEl.textContent = sch.address || "";
  addrEl.setAttribute("style", fmtStyleString(sch.addrFmt) + (headerOnAccent?"color:rgba(255,255,255,.9);":""));
  headerText.appendChild(addrEl);
  header.appendChild(headerText);
  card.appendChild(header);

  // body
  const isSidebar = tpl.layout === "sidebar-left" || tpl.layout === "sidebar-right";
  const body = document.createElement("div");
  body.className = "card-body";
  const photoWrap = document.createElement("div");
  photoWrap.className = "card-photo-wrap";
  const pw = state.design.photoW * PX_PER_CM, ph = state.design.photoH * PX_PER_CM;
  photoWrap.style.width = pw + "px";
  photoWrap.style.height = ph + "px";
  photoWrap.style.borderRadius = tpl.photoShape === "circle" ? "50%" : tpl.photoShape === "rounded" ? "12%" : "4px";
  if(student.photo){
    const img = document.createElement("img");
    img.className = "card-photo"; img.src = student.photo;
    photoWrap.appendChild(img);
  }else{
    const ni = document.createElement("div");
    ni.className = "noimg"; ni.textContent = "No Photo";
    photoWrap.appendChild(ni);
  }
  // Sidebar templates hold the photo in a full-height accent-colored
  // side panel instead of inline with the info column.
  if(!isSidebar) body.appendChild(photoWrap);

  const info = document.createElement("div");
  info.className = "card-info";
  const nameRow = document.createElement("div");
  nameRow.className = "stu-name";
  nameRow.textContent = student.name || "—";
  info.appendChild(nameRow);

  const rows = [
    ["Roll", student.roll],
    ["Class", [student.cls, student.section].filter(Boolean).join(" - ")],
    ["Blood Grp", student.blood],
    ["Address", formatStudentAddress(student)],
  ];
  rows.forEach(([label,val])=>{
    if(!val) return;
    const row = document.createElement("div");
    row.className = "info-row" + (label==="Address" ? " address" : "");
    row.innerHTML = `<span class="info-label">${esc(label)}</span><span class="info-value">${esc(val)}</span>`;
    info.appendChild(row);
  });
  body.appendChild(info);
  card.appendChild(body);

  if(isSidebar){
    const sidebar = document.createElement("div");
    sidebar.className = "card-sidebar";
    sidebar.appendChild(photoWrap);
    card.insertBefore(sidebar, header);
  }


  // footer
  const footer = document.createElement("div");
  footer.className = "card-footer";
  const valid = document.createElement("div");
  valid.className = "valid-upto";
  valid.textContent = sch.validUpto ? `Valid Upto: ${formatDatePretty(sch.validUpto)}` : "";
  footer.appendChild(valid);
  const sigWrap = document.createElement("div");
  sigWrap.className = "signature";
  if(sch.sigImg){
    const sig = document.createElement("img");
    sig.src = sch.sigImg;
    sig.style.width = (sch.sigW * (PX_PER_CM/10)) + "px";
    sig.style.height = (sch.sigH * (PX_PER_CM/10)) + "px";
    sig.onerror = ()=>{ sig.style.display = "none"; }; // a broken/unsupported upload never breaks card layout
    sigWrap.appendChild(sig);
  }
  const sigLabel = document.createElement("span");
  sigLabel.textContent = "T.I.C.";
  sigWrap.appendChild(sigLabel);
  footer.appendChild(sigWrap);
  card.appendChild(footer);

  const decor = document.createElement("div");
  decor.className = "card-decor";
  card.appendChild(decor);

  return card;
}

function filteredSortedStudents(){
  let list = state.students.slice();
  const q = state.ui.search.trim().toLowerCase();
  if(q){
    list = list.filter(s => [s.roll,s.name,s.cls,s.section,s.blood].some(v => String(v||"").toLowerCase().includes(q)));
  }
  if(state.ui.filterClass) list = list.filter(s => s.cls === state.ui.filterClass);
  if(state.ui.filterBlood) list = list.filter(s => s.blood === state.ui.filterBlood);
  const key = state.ui.sortKey, dir = state.ui.sortDir === "asc" ? 1 : -1;
  list.sort((a,b)=>{
    const av = (a[key]||"").toString(), bv = (b[key]||"").toString();
    const an = parseFloat(av), bn = parseFloat(bv);
    if(!isNaN(an) && !isNaN(bn) && String(an)===av.trim() && String(bn)===bv.trim()) return (an-bn)*dir;
    return av.localeCompare(bv, undefined, {numeric:true}) * dir;
  });
  return list;
}

function renderStepPills(){

  host.innerHTML = labels.map((l,i)=>{
    const active = (i===0 && state.students.length===0) ? "active" : "";

/* ==================================================================
   RENDER: student table
   ================================================================== */
function renderStudentTable(){
  const tbody = document.getElementById("studentTableBody");
  const empty = document.getElementById("emptyState");
  const list = filteredSortedStudents();

  document.getElementById("studentCountChip").textContent = `${state.students.length} student${state.students.length===1?"":"s"}`;
  const sel = selectedStudents().length;
  document.getElementById("selectionSummary").textContent = state.students.length ? `Selected: ${sel} / Total: ${state.students.length}` : "";
  document.getElementById("selectedCountLabel").textContent = sel;

  // filter dropdown option population
  const classSel = document.getElementById("filterClass");
  const bloodSel = document.getElementById("filterBlood");
  const classes = [...new Set(state.students.map(s=>s.cls).filter(Boolean))].sort();
  const bloods = [...new Set(state.students.map(s=>s.blood).filter(Boolean))].sort();
  const curClass = state.ui.filterClass, curBlood = state.ui.filterBlood;
  classSel.innerHTML = `<option value="">All classes</option>` + classes.map(c=>`<option value="${esc(c)}" ${c===curClass?"selected":""}>${esc(c)}</option>`).join("");
  bloodSel.innerHTML = `<option value="">All blood groups</option>` + bloods.map(c=>`<option value="${esc(c)}" ${c===curBlood?"selected":""}>${esc(c)}</option>`).join("");

  if(!state.students.length){
    tbody.innerHTML = "";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");

  tbody.innerHTML = list.map(s=>{
    const photoCell = s.photo
      ? `<img class="mini-photo" src="${s.photo}" alt="">`
      : `<div class="mini-photo missing">N/A</div>`;
    const addr = [s.vill,s.po,s.dist].filter(Boolean).join(", ");
    return `<tr data-id="${s.id}">
      <td><input type="checkbox" class="rowSelect" ${s.selected?"checked":""}></td>
      <td>${photoCell}</td>
      <td>${esc(s.roll)}</td>
      <td>${esc(s.name)}</td>
      <td>${esc(s.cls)}</td>
      <td>${esc(s.section)}</td>
      <td>${esc(s.blood)}</td>
      <td>${esc(addr)}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn previewRowBtn" title="Preview">👁</button>
          <button class="icon-btn editRowBtn" title="Edit">✎</button>
          <button class="icon-btn danger deleteRowBtn" title="Delete">🗑</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("tr").forEach(tr=>{
    const id = tr.getAttribute("data-id");
    tr.querySelector(".rowSelect").addEventListener("change", e=>{
      const s = state.students.find(s=>s.id===id); s.selected = e.target.checked; renderAll();
    });
    tr.querySelector(".previewRowBtn").addEventListener("click", ()=>{
      state.ui.previewStudentId = id; renderPreview(); renderGenerateSection();
      document.getElementById("step4").classList.remove("collapsed");
      document.getElementById("step4").scrollIntoView({behavior:"smooth", block:"start"});
    });
    tr.querySelector(".editRowBtn").addEventListener("click", ()=>openEditModal(id));
    tr.querySelector(".deleteRowBtn").addEventListener("click", ()=>{
      state.students = state.students.filter(s=>s.id!==id);
      if(state.ui.previewStudentId===id) state.ui.previewStudentId = state.students[0]?.id || null;
      renderAll();
      toast("Student removed.", "ok");
    });
  });
}

function openEditModal(id){
  const s = state.students.find(s=>s.id===id);
  if(!s) return;
  const host = document.getElementById("modalHost");
  host.innerHTML = `
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Edit Student</h3>
      <div class="modal-grid">
        <div class="field"><label class="field-label">Roll</label><input type="text" id="mRoll" value="${esc(s.roll)}"></div>
        <div class="field"><label class="field-label">Student Name</label><input type="text" id="mName" value="${esc(s.name)}"></div>
        <div class="field"><label class="field-label">Class</label><input type="text" id="mCls" value="${esc(s.cls)}"></div>
        <div class="field"><label class="field-label">Section</label><input type="text" id="mSection" value="${esc(s.section)}"></div>
        <div class="field"><label class="field-label">Vill</label><input type="text" id="mVill" value="${esc(s.vill)}"></div>
        <div class="field"><label class="field-label">P.O.</label><input type="text" id="mPo" value="${esc(s.po)}"></div>
        <div class="field"><label class="field-label">Dist</label><input type="text" id="mDist" value="${esc(s.dist)}"></div>
        <div class="field"><label class="field-label">Blood Group</label><input type="text" id="mBlood" value="${esc(s.blood)}"></div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label class="field-label">Photo</label>
        <div class="upload-row">
          <img id="mPhotoThumb" class="thumb-preview" src="${s.photo||''}" style="${s.photo?'':'display:none;'}">
          <input type="file" id="mPhotoInput" accept="image/*" class="hidden">
          <button class="btn btn-sm btn-outline" id="mPhotoBtn">Change Photo</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="mCancel">Cancel</button>
        <button class="btn btn-primary" id="mSave">Save Changes</button>
      </div>
    </div>
  </div>`;
  let newPhoto = s.photo;
  document.getElementById("mPhotoBtn").addEventListener("click", ()=>document.getElementById("mPhotoInput").click());
  document.getElementById("mPhotoInput").addEventListener("change", async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    newPhoto = await fileToDataURL(f);
    const thumb = document.getElementById("mPhotoThumb");
    thumb.src = newPhoto; thumb.style.display = "block";
  });
  const close = ()=>host.innerHTML = "";
  document.getElementById("mCancel").addEventListener("click", close);
  document.getElementById("modalBackdrop").addEventListener("click", (e)=>{ if(e.target.id==="modalBackdrop") close(); });
  document.getElementById("mSave").addEventListener("click", ()=>{
    s.roll = document.getElementById("mRoll").value.trim();
    s.name = document.getElementById("mName").value.trim();
    s.cls = document.getElementById("mCls").value.trim();
    s.section = document.getElementById("mSection").value.trim();
    s.vill = document.getElementById("mVill").value.trim();
    s.po = document.getElementById("mPo").value.trim();
    s.dist = document.getElementById("mDist").value.trim();
    s.blood = document.getElementById("mBlood").value.trim();
    s.photo = newPhoto;
    close();
    renderAll();
    toast("Student updated.", "ok");
  });
}

   ================================================================== */
function renderTemplateGallery(){
  const host = document.getElementById("tplGallery");
  host.innerHTML = TEMPLATES.map((t,i)=>{
    const active = t.id === state.design.templateId;
    const num = String(i+1).padStart(2,"0");
    return `<div class="tpl-card ${active?"active":""}" data-id="${t.id}">
      <div class="tpl-thumb" style="background:${t.bg};color:${t.text};">
        <div class="t-head" style="background:${t.headerStyle==='onaccent'?t.accent:'transparent'};color:${t.headerStyle==='onaccent'?'#fff':t.text};border-bottom:2px solid ${t.accent};">SCHOOL NAME</div>
        <div class="t-body">
          <div class="t-photo" style="border:1.5px solid ${t.accent2};border-radius:${t.photoShape==='circle'?'50%':t.photoShape==='rounded'?'30%':'10%'};"></div>
          <div class="t-lines"><i style="background:${t.accent};width:80%;"></i><i style="width:60%;"></i><i style="width:70%;"></i></div>
        </div>
      </div>
      <div class="tpl-name">Template ${num}<br><span style="font-weight:500;opacity:.7;">${esc(t.name)}</span></div>
    </div>`;
  }).join("");
  host.querySelectorAll(".tpl-card").forEach(el=>{
    el.addEventListener("click", ()=>{
      const newId = el.getAttribute("data-id");
      if(newId !== state.design.templateId){
        // Switching templates restores every element to that template's
        // default position, per the Template Default Position → Smart
        // Space Calculation → User Manual Position priority rule.
        state.design.photoOffsetX = 0; state.design.photoOffsetY = 0;
        state.design.addrOffsetX = 0; state.design.addrOffsetY = 0;
        state.school.logoOffsetX = 0; state.school.logoOffsetY = 0;
        state.school.sigOffsetX = 0; state.school.sigOffsetY = 0;
      }
      state.design.templateId = newId;
      renderTemplateGallery(); renderDesignControls(); renderSchoolPanel(); renderPreview();
    });
  });
}

function currentPreviewStudent(){
  if(!state.students.length) return null;
  return state.students.find(s=>s.id===state.ui.previewStudentId) || state.students[0];

function renderPreview(){
  const stage = document.getElementById("previewStage");
  const student = currentPreviewStudent() || { name:"Sample Student", roll:"101", cls:"VI", section:"A", blood:"O+", vill:"Rampur", po:"Rampur", dist:"Bardhaman", photo:null };
  stage.innerHTML = "";
  const { wPx, hPx } = cardPixelSize();
  // Scale the preview to fit BOTH the available width and height of the
  // stage (never just width) so the complete ID Card — at its real
  // configured aspect ratio — always fits inside the visible preview
  // area with no clipping and no page overflow. This only changes how
  // large the card is drawn on screen; it never touches the underlying
  // state.design.widthCm/heightCm used for PNG/PDF export.
  const padding = 24; // keep a little breathing room inside the stage
  const availW = Math.max(40, stage.clientWidth - padding);
  const availH = Math.max(40, stage.clientHeight - padding);
  const autoScale = Math.min(1, availW / wPx, availH / hPx);
  const scale = autoScale * state.ui.zoom;
  const card = buildCardElement(student, { scale });
  stage.appendChild(card);
  fitCardContent(card);
  applyManualPositions(card);

  document.getElementById("cardSizeInfo").textContent =
    `${cardPixelSize().wCm.toFixed(1)} × ${cardPixelSize().hCm.toFixed(1)} cm · ${state.design.orientation} · ${getTemplate(state.design.templateId).name}`;
  document.getElementById("zoomLabel").textContent = Math.round(state.ui.zoom*100)+"%";

  // student strip
  const strip = document.getElementById("stuStrip");
  if(!state.students.length){
    strip.innerHTML = `<span class="small">Import students to preview real data.</span>`;
  }else{
    strip.innerHTML = state.students.map(s=>{
      const active = s.id === (currentPreviewStudent()?.id);
      const img = s.photo ? `<img src="${s.photo}">` : `<span style="width:22px;height:22px;border-radius:50%;background:var(--paper);display:inline-block;"></span>`;
      return `<div class="stu-chip ${active?"active":""}" data-id="${s.id}">${img}<span>${esc(s.name||s.roll)}</span></div>`;
    }).join("");
    strip.querySelectorAll(".stu-chip").forEach(el=>{
      el.addEventListener("click", ()=>{ state.ui.previewStudentId = el.getAttribute("data-id"); renderPreview(); });
    });
  }
}

/* ==================================================================
   EXPORTS
   ================================================================== */
const EXPORT_SCALE = 3; // ~300dpi given 96dpi base

// Waits for every <img> inside the card to finish decoding, and for
// webfonts to finish loading, before we hand the node to html2canvas.
// This is the #1 cause of "blank"/partial PNG & PDF output: html2canvas
// snapshotting a card whose photo/logo/signature <img> tags haven't
// finished loading yet (data-URL images still need a decode pass).
function waitForCardReady(card){
  const imgs = Array.from(card.querySelectorAll("img"));
  const imgReady = imgs.map(img=>{
    if(img.complete && img.naturalWidth > 0) return Promise.resolve();
    return new Promise(resolve=>{
      const done = ()=>resolve();
      img.addEventListener("load", done, { once:true });
      // Don't let one broken image hang the whole export — resolve anyway.
      img.addEventListener("error", done, { once:true });
    });
  });
  const fontsReady = (document.fonts && document.fonts.ready)
    ? document.fonts.ready.catch(()=>{})
    : Promise.resolve();
  return Promise.all([...imgReady, fontsReady]);
}

async function renderCardToCanvas(student){
  const stage = document.getElementById("exportStage");
  stage.innerHTML = "";
  const card = buildCardElement(student, {});
  stage.appendChild(card);

  await waitForCardReady(card);
  fitCardContent(card);
  applyManualPositions(card);
  // one extra frame so the browser has actually painted the layout
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  let canvas;
  try{
    canvas = await html2canvas(card, {
      scale: EXPORT_SCALE,
      backgroundColor: "#ffffff",
      useCORS: true,
      allowTaint: false,
      logging: false,
      imageTimeout: 15000,
      removeContainer: true,
      onclone: (clonedDoc, clonedCard) => {
        // Neutralize the off-screen offset inside the CLONE only, so
        // html2canvas always captures the card as if it sat on-screen at
        // (0,0) — this is what avoids clipping/blank-frame issues with
        // far off-screen elements. The live page/exportStage is untouched.
        const clonedStage = clonedDoc.getElementById("exportStage");
        if(clonedStage){
          clonedStage.style.position = "static";
          clonedStage.style.left = "0";
          clonedStage.style.top = "0";
          clonedStage.style.overflow = "visible";
        }
        if(clonedCard) clonedCard.style.transform = "none";
      }
    });
  }catch(renderErr){
    console.error("html2canvas render failed:", renderErr);
    throw new Error("Rendering the ID card failed. Please try again.");
  }

  stage.innerHTML = "";

  if(!canvas || canvas.width === 0 || canvas.height === 0){
    throw new Error("The card rendered with zero size — please try again.");
  }
  return canvas;
}

function canvasToBlobAsync(canvas, type, quality){
  return new Promise((resolve, reject)=>{
    try{
      canvas.toBlob(blob=>{
        if(blob) resolve(blob);
        else reject(new Error("Canvas produced an empty image."));
      }, type, quality);
    }catch(err){
      reject(err);
    }
  });
}

function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoke on a delay — some mobile browsers (esp. iOS Safari) need the
  // object URL to remain valid for a moment after the click for the
  // download/share sheet to actually pick it up.
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}

function computeGridLayout(){
  const { wCm, hCm } = cardPixelSize();
  const pageW = 21.0, pageH = 29.7; // A4 cm
  const margin = state.design.marginCm, gap = state.design.gapCm;
  const usableW = pageW - 2*margin, usableH = pageH - 2*margin;
  const cols = Math.max(1, Math.floor((usableW + gap) / (wCm + gap)));
  const rows = Math.max(1, Math.floor((usableH + gap) / (hCm + gap)));
  const fits = (wCm <= usableW) && (hCm <= usableH);
  const gridW = cols*wCm + (cols-1)*gap;
  const gridH = rows*hCm + (rows-1)*gap;
  const offsetX = margin + Math.max(0, (usableW - gridW)/2);
  const offsetY = margin + Math.max(0, (usableH - gridH)/2);
  return { pageW, pageH, margin, gap, cols, rows, wCm, hCm, offsetX, offsetY, fits, perPage: cols*rows };
}

function drawCutMarks(doc, layout){
  // Dashed cutting guides drawn through the MIDDLE of the gap between
  // adjacent cards (not around each card individually), so they clearly
  // show where to cut without ever touching the card artwork.
  const { offsetX, offsetY, wCm, hCm, gap, cols, rows } = layout;
  const gridW = cols*wCm + (cols-1)*gap;
  const gridH = rows*hCm + (rows-1)*gap;
  const bleed = 0.15; // extend marks slightly past the grid edge
  doc.setDrawColor(130,130,130);
  doc.setLineWidth(0.012);
  if(doc.setLineDashPattern) doc.setLineDashPattern([0.06,0.05], 0);
  for(let c=1;c<cols;c++){
    const lineX = offsetX + (c-1)*(wCm+gap) + wCm + gap/2;
    doc.line(lineX, offsetY - bleed, lineX, offsetY + gridH + bleed);
  }
  for(let r=1;r<rows;r++){
    const lineY = offsetY + (r-1)*(hCm+gap) + hCm + gap/2;
    doc.line(offsetX - bleed, lineY, offsetX + gridW + bleed, lineY);
  }
  if(doc.setLineDashPattern) doc.setLineDashPattern([], 0);
}

async function generateBulkPDF(){
  const students = selectedStudents();
  if(!students.length){ toast("Select at least one student for bulk generation.", "err"); return; }
  if(!state.school.name.trim()){ toast("Please enter a School Name before generating.", "err"); return; }

  const layout = computeGridLayout();
  if(!layout.fits){ toast("The card size is larger than the printable A4 area. Reduce the card size or margins.", "err"); return; }

  const btn = document.getElementById("generatePdfBtn");
  const original = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Generating…`;
  const progWrap = document.getElementById("genProgressWrap");
  const progFill = document.getElementById("genProgressFill");
  const progLabel = document.getElementById("genProgressLabel");
  progWrap.classList.remove("hidden");
  progFill.classList.remove("indeterminate");

  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"cm", format:"a4", orientation:"portrait" });
    const { pageW, pageH, margin, gap, cols, rows, wCm, hCm, offsetX, offsetY, perPage } = layout;

    let idx = 0;
    for(const student of students){
      const posInPage = idx % perPage;
      if(idx > 0 && posInPage === 0) doc.addPage();
      if(posInPage === 0) drawCutMarks(doc, layout);
      const r = Math.floor(posInPage / cols);
      const c = posInPage % cols;
      const x = offsetX + c*(wCm+gap);
      const y = offsetY + r*(hCm+gap);

      let canvas;
      try{
        canvas = await renderCardToCanvas(student);
      }catch(cardErr){
        console.error(`Card render failed for ${student.name||student.roll}:`, cardErr);
        throw new Error(`Failed while rendering the card for "${student.name||student.roll||"a student"}". ${cardErr.message||""}`);
      }
      const imgData = canvas.toDataURL("image/png", 1.0);
      doc.addImage(imgData, "PNG", x, y, wCm, hCm, undefined, "FAST");

      idx++;
      const pct = Math.round((idx/students.length)*100);
      progFill.style.width = pct + "%";
      progLabel.textContent = `${idx} / ${students.length}`;
      await new Promise(r=>requestAnimationFrame(r));
    }

    // footer instruction on every page
    const pageCount = doc.internal.getNumberOfPages();
    for(let p=1; p<=pageCount; p++){
      doc.setPage(p);
      doc.setFontSize(7);
      doc.setTextColor(150,150,150);
      doc.text("Print at 100% / Actual Size — do not select \"Fit to Page\".", pageW/2, pageH-0.4, { align:"center" });
    }

    // Use a Blob + object URL + anchor click instead of jsPDF's built-in
    // doc.save() — on several mobile browsers (notably iOS Safari) .save()
    // opens the PDF as a data: URI instead of downloading it, which is
    // the main reason "Generate Bulk PDF" appeared to do nothing on phones.
    const pdfBlob = doc.output("blob");
    if(!pdfBlob || pdfBlob.size === 0) throw new Error("The generated PDF was empty.");
    triggerBlobDownload(pdfBlob, `Student_ID_Cards_${new Date().toISOString().slice(0,10)}.pdf`);
    toast(`Bulk PDF generated — ${students.length} card(s) across ${pageCount} page(s).`, "ok");
  }catch(err){
    console.error(err);
    toast("Could not generate the PDF — " + (err && err.message ? err.message : "please try again."), "err");
  }finally{
    btn.disabled = false; btn.innerHTML = original;
    setTimeout(()=>progWrap.classList.add("hidden"), 800);
  }
}

/* ==================================================================
   RESIZABLE SETTINGS PANEL
   Drags the boundary between the settings panel and the Live Preview
   by writing a CSS custom property (--settings-panel-w) on the layout
   grid — this only ever affects the UI layout/preview *display* scale.
   It never touches state.design.widthCm/heightCm, so the actual ID
   Card dimensions used for PNG/PDF export are completely unaffected.
   Works with mouse, touch and pen via Pointer Events, is throttled to
   one update per animation frame for smooth dragging, and remembers
   the chosen width for the current browser session.
   ================================================================== */
function initPanelResize(){
  const layout = document.querySelector(".app-layout");
  const handle = document.getElementById("panelResizeHandle");
  const resetBtn = document.getElementById("panelResizeResetBtn");
  if(!layout || !handle) return;

  const STORAGE_KEY = "idCardSettingsPanelWidth";
  const DEFAULT_W = 440;
  const MIN_W = 280;

  function maxW(){ return Math.max(MIN_W, Math.round(layout.getBoundingClientRect().width * 0.6)); }
  function clampW(w){ return Math.min(Math.max(w, MIN_W), maxW()); }
  function currentW(){
    const v = parseFloat(getComputedStyle(layout).getPropertyValue("--settings-panel-w"));
    return isNaN(v) ? DEFAULT_W : v;
  }
  function applyW(w){ layout.style.setProperty("--settings-panel-w", w + "px"); }
  function saveW(w){ try{ sessionStorage.setItem(STORAGE_KEY, String(Math.round(w))); }catch(e){} }
  function loadW(){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if(raw){ const w = parseFloat(raw); if(!isNaN(w)) return w; }
    }catch(e){}
    return null;
  }

  // restore a previously saved width (this session only), clamped to the
  // current viewport in case the window is now narrower than before
  const saved = loadW();
  applyW(clampW(saved != null ? saved : DEFAULT_W));

  let dragging = false, startX = 0, startW = DEFAULT_W, rafId = null, pendingW = null;

  function scheduleApply(w){
    pendingW = clampW(w);
    if(rafId) return;
    rafId = requestAnimationFrame(()=>{
      rafId = null;
      if(pendingW == null) return;
      applyW(pendingW);
      renderPreview(); // rescale the ID Card to the new available space only
    });
  }

  function onPointerDown(e){
    dragging = true;
    startX = e.clientX;
    startW = currentW();
    document.body.classList.add("panel-resizing");
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }
  function onPointerMove(e){
    if(!dragging) return;
    scheduleApply(startW + (e.clientX - startX));
  }
  function onPointerUp(){
    if(!dragging) return;
    dragging = false;
    document.body.classList.remove("panel-resizing");
    saveW(currentW());
  }

  handle.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);

  // keyboard accessibility — Left/Right arrows nudge the boundary
  handle.addEventListener("keydown", e=>{
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const step = e.shiftKey ? 40 : 16;
    const next = clampW(currentW() + (e.key === "ArrowRight" ? step : -step));
    applyW(next); saveW(next); renderPreview();
    e.preventDefault();
  });

  if(resetBtn){
    resetBtn.addEventListener("click", ()=>{
      applyW(DEFAULT_W); saveW(DEFAULT_W); renderPreview();
    });
  }

  // keep the panel width sane (and the preview correctly scaled) if the
  // browser window itself is resized
  window.addEventListener("resize", debounce(()=>{
    const clamped = clampW(currentW());
    applyW(clamped);
    renderPreview();
  }, 150));
}

function saveUIState(){ /* in-memory only; no persistence required across reloads */ }

/* ==================================================================
   INIT
   ================================================================== */
function init(){
  renderShell();
  wireEvents();
  initPanelResize();
  renderAll();
}
document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
